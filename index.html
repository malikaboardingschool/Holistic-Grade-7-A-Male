        const headers = [
          "Nama Lengkap", "NIS/Kelas", "Nilai SAS (Ganjil)", "Nilai SAT (Genap)", 
          "Hasil Psikotes", "Progres 1 Semester", "Mapel Unggul", "Mapel Perlu Peningkatan",

          "Sosial dan Kepemimpinan", "Prestasi Non-Akademik", "Fokus Kelas Selanjutnya", "Pesan Wali Kelas"
        ];

        const rows = students.map(s => [
          s.nama || "", s.nis || "", s.sas || 80, s.sat || 80, s.psikotes || "", s.progres_1s || "",
          s.mapel_unggul || "", s.mapel_perlu || "", s.ibadah || "", s.tahfizh_juz || 0, s.tahfizh_detail || "",
          s.disiplin || "", s.sosial || "", s.prestasi || "", s.fokus || "", s.pesan_wali || ""

        const escapeCSV = (val) => {
          if (val === undefined || val === null) return '';
          let str = String(val).replace(/"/g, '""');
          if (str.includes(',') || str.includes('\n') || str.includes('\r') || str.includes('"') || str.includes(';')) {
            return `"${str}"`;
          }
          return str;
        };

        const csvContent = "\uFEFF" + [
          headers.join(";"),
          ...rows.map(r => r.map(escapeCSV).join(";"))

              else if (header.includes("fokus")) key = "fokus";
              else if (header.includes("pesan")) key = "pesan_wali";

              rowObj[key] = cols[index];
            });

                            </div>
                            <div className="border border-teal-200 rounded-xl p-4 bg-teal-50/20 h-[105px] h-print-105 flex flex-col justify-center">
                              <h4 className="text-xs font-black text-teal-800 uppercase mb-1">Tahfizh Qur'an</h4>
                              <p className="text-sm font-extrabold text-slate-800">{selectedStudent.tahfizh_detail || `${selectedStudent.tahfizh_juz} Juz`}</p>
                            </div>
                          </div>
                        </div>

                        <div>
                          <div className="flex items-center gap-2 mb-3"><div className="w-[4px] h-[22px] bg-[#2b3990]"></div><h3 className="text-sm font-black uppercase text-slate-900">KARAKTER DAN KEMATANGAN DIRI</h3></div>
                          <div className="grid grid-cols-1 md:grid-cols-2 grid-cols-print-2 gap-4">
                            <div className="border border-blue-200 bg-blue-50/10 rounded-xl p-4 h-[105px] h-print-105 flex flex-col justify-between"><h4 className="text-xs font-black text-blue-800 uppercase">Ibadah Harian</h4><p className="text-xs text-slate-700 font-medium mt-1">{selectedStudent.ibadah}</p></div>
                            <div className="border border-rose-200 bg-rose-50/10 rounded-xl p-4 h-[105px] h-print-105 flex flex-col justify-between"><h4 className="text-xs font-black text-rose-800 uppercase">Sikap dan Disiplin</h4><p className="text-xs text-slate-700 font-medium mt-1">{selectedStudent.disiplin}</p></div>
                            <div className="border border-amber-200 bg-amber-50/10 rounded-xl p-4 h-[105px] h-print-105 flex flex-col justify-between"><h4 className="text-xs font-black text-amber-800 uppercase">Interaksi Sosial dan Kepemimpinan</h4><p className="text-xs text-slate-700 font-medium mt-1">{selectedStudent.sosial}</p></div>
                            <div className="border border-yellow-200 bg-yellow-50/10 rounded-xl p-4 h-[105px] h-print-105 flex flex-col justify-between"><h4 className="text-xs font-black text-yellow-800 uppercase">Prestasi Non-Akademik</h4><p className="text-xs text-slate-700 font-medium mt-1">{selectedStudent.prestasi}</p></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* PAGE 2 */}
                  <div className="print-page bg-white max-w-[210mm] mx-auto p-12 print:p-[15mm] shadow-md border relative overflow-hidden">
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[420px] h-[420px] pointer-events-none opacity-[0.04] flex items-center justify-center"><img src="https://iili.io/FsLlXA7.png" className="w-full h-full object-contain" /></div>
                    <div className="relative z-10 flex flex-col h-full justify-between">
                      <div>
                        <div className="border-b pb-3 mb-6"><div className="flex justify-between items-center"><span className="text-xs font-bold text-slate-500">Lanjutan Rapor Perkembangan Holistik Santri</span><span className="text-xs font-bold text-[#2b3990]">{selectedStudent.nama} ({selectedStudent.nis})</span></div></div>
                        <div className="mb-6"><div className="border-2 border-dashed border-indigo-300 bg-indigo-50/10 rounded-xl p-5"><h4 className="text-sm font-black text-indigo-950 mb-2">Fokus Kelas Selanjutnya</h4><p className="text-xs text-slate-700 font-medium">{selectedStudent.fokus}</p></div></div>
                        <div className="mb-10"><div className="border-2 border-dashed border-purple-300 bg-purple-50/10 rounded-xl p-5"><h4 className="text-sm font-black text-purple-950 mb-2">Pesan Wali Kelas dan Wali Kamar</h4><p className="text-xs text-slate-700 font-medium">{selectedStudent.pesan_wali}</p></div></div>
                      </div>
                      <div className="space-y-12">
                        <div className="text-center text-xs"><p className="font-semibold text-slate-700">Tangerang, {globalTanggal}</p></div>
                        <div className="grid grid-cols-2 grid-cols-print-2 gap-12 text-center text-xs">
                          <div><p className="text-slate-500 font-medium mb-20">Wali Kelas</p><p className="font-extrabold text-slate-900 underline">{globalWaliKelas}</p></div>
                          <div><p className="text-slate-500 font-medium mb-20">Wali Kamar</p><p className="font-extrabold text-slate-900 underline">{globalWaliKamar}</p></div>
                        </div>
                        <div className="text-center text-xs pt-4"><p className="text-slate-500 font-medium mb-20">{globalJabatanKS}</p><p className="font-extrabold text-slate-900 underline">{globalNamaKS}</p></div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: DATABASE */}
              {activeTab === 'database' && (
                <div className="bg-white rounded-2xl shadow-sm border p-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900">Database Rapor Santri</h2>
                      <p className="text-sm text-slate-500">Total Terdaftar: {students.length} Santri</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={handleDownloadExcel} className="px-4 py-2 bg-blue-600 text-white font-bold text-xs uppercase rounded-lg shadow">💾 Unduh Database</button>
                      <button onClick={() => { setShowImportModal(true); setBulkImportText(""); }} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs uppercase rounded-lg shadow">📥 Impor Spreadsheet</button>
                    </div>
                  </div>
                  <div className="overflow-x-auto border rounded-xl">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead>
                        <tr className="bg-slate-50 border-b text-slate-700">
                          <th className="p-3 font-semibold">Nama Santri</th>
                          <th className="p-3 font-semibold">NIS</th>
                          <th className="p-3 font-semibold text-center">SAS</th>
                          <th className="p-3 font-semibold text-center">SAT</th>
                          <th className="p-3 font-semibold text-center">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {students.map((student) => (
                          <tr key={student.id} className="hover:bg-slate-50/50 transition">
                            <td className="p-3 font-bold text-slate-900">{student.nama}</td>
                            <td className="p-3 text-slate-600">{student.nis}</td>
                            <td className="p-3 text-center font-bold text-[#2b3990]">{student.sas}</td>
                            <td className="p-3 text-center font-bold text-[#4d5ec2]">{student.sat}</td>
                            <td className="p-3 flex justify-center gap-2">
                              <button onClick={() => { setIsAddingNew(false); setEditingStudent(student); }} className="px-2 py-1 bg-slate-100 text-slate-700 text-xs font-bold rounded-md">Edit</button>
                              <button onClick={() => handleDeleteStudent(student.id)} className="px-2 py-1 bg-rose-50 text-rose-600 text-xs font-bold rounded-md">Hapus</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* EDIT/ADD MODAL */}
          {editingStudent && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4">
                <h3 className="text-lg font-bold border-b pb-2">{isAddingNew ? "➕ Tambah Data Santri Baru" : "✏️ Edit Detail Rapor"}</h3>
                <div className="grid grid-cols-2 gap-4">
                  <div className="col-span-2 sm:col-span-1"><label className="block text-xs font-bold mb-1">Nama Lengkap</label><input type="text" value={editingStudent.nama} onChange={(e) => setEditingStudent({...editingStudent, nama: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div className="col-span-2 sm:col-span-1"><label className="block text-xs font-bold mb-1">NIS / Kelas</label><input type="text" value={editingStudent.nis} onChange={(e) => setEditingStudent({...editingStudent, nis: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div><label className="block text-xs font-bold mb-1">SAS (Nilai Ganjil)</label><input type="number" value={editingStudent.sas} onChange={(e) => setEditingStudent({...editingStudent, sas: Number(e.target.value)})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm font-bold text-[#2b3990]"/></div>
                  <div><label className="block text-xs font-bold mb-1">SAT (Nilai Genap)</label><input type="number" value={editingStudent.sat} onChange={(e) => setEditingStudent({...editingStudent, sat: Number(e.target.value)})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm font-bold text-indigo-700"/></div>
                  <div><label className="block text-xs font-bold mb-1">Jumlah Juz (Angka)</label><input type="number" value={editingStudent.tahfizh_juz} onChange={(e) => setEditingStudent({...editingStudent, tahfizh_juz: Number(e.target.value)})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm font-bold text-teal-700"/></div>
                  <div><label className="block text-xs font-bold mb-1">Keterangan Juz Al-Qur'an</label><input type="text" value={editingStudent.tahfizh_detail} onChange={(e) => setEditingStudent({...editingStudent, tahfizh_detail: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Hasil Psikotes</label><input type="text" value={editingStudent.psikotes} onChange={(e) => setEditingStudent({...editingStudent, psikotes: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Progres 1 Semester</label><input type="text" value={editingStudent.progres_1s} onChange={(e) => setEditingStudent({...editingStudent, progres_1s: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div><label className="block text-xs font-bold mb-1">Mata Pelajaran Unggul</label><input type="text" value={editingStudent.mapel_unggul} onChange={(e) => setEditingStudent({...editingStudent, mapel_unggul: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div><label className="block text-xs font-bold mb-1">Perlu Peningkatan</label><input type="text" value={editingStudent.mapel_perlu} onChange={(e) => setEditingStudent({...editingStudent, mapel_perlu: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Observasi Ibadah Harian</label><textarea value={editingStudent.ibadah} onChange={(e) => setEditingStudent({...editingStudent, ibadah: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm h-16 resize-none"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Sikap dan Disiplin</label><textarea value={editingStudent.disiplin} onChange={(e) => setEditingStudent({...editingStudent, disiplin: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm h-16 resize-none"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Sosial & Kepemimpinan</label><textarea value={editingStudent.sosial} onChange={(e) => setEditingStudent({...editingStudent, sosial: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm h-16 resize-none"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Prestasi Non-Akademik</label><input type="text" value={editingStudent.prestasi} onChange={(e) => setEditingStudent({...editingStudent, prestasi: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Fokus Kelas Selanjutnya</label><textarea value={editingStudent.fokus} onChange={(e) => setEditingStudent({...editingStudent, fokus: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm h-16 resize-none"/></div>
                  <div className="col-span-2"><label className="block text-xs font-bold mb-1">Pesan Wali Kelas & Kamar</label><textarea value={editingStudent.pesan_wali} onChange={(e) => setEditingStudent({...editingStudent, pesan_wali: e.target.value})} className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm h-16 resize-none"/></div>
                </div>
                <div className="flex justify-end gap-2 pt-4 border-t">
                  <button onClick={() => setEditingStudent(null)} className="px-4 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100 rounded-lg">Batal</button>
                  <button onClick={() => handleSaveStudent(editingStudent)} className="px-4 py-2 text-sm font-semibold text-white bg-[#2b3990] rounded-lg shadow">Simpan</button>
                </div>
              </div>
            </div>
          )}

          {/* EXCEL IMPORT MODAL */}
          {showImportModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 space-y-4">
                <div className="flex justify-between items-start border-b pb-2">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">📥 Impor dari Excel / Google Sheets</h3>
                    <p className="text-xs text-slate-500">Salin kolom dari spreadsheet Anda lalu tempel di bawah ini.</p>
                  </div>
                  <button onClick={getTemplateTSV} className="text-xs bg-indigo-50 text-indigo-700 font-bold px-3 py-1.5 rounded-lg">Ambil Template Contoh</button>
                </div>
                <textarea placeholder="Tempel baris spreadsheet Anda di sini..." value={bulkImportText} onChange={(e) => setBulkImportText(e.target.value)} className="w-full h-64 p-3 bg-slate-50 border rounded-xl text-xs font-mono resize-none focus:outline-none"/>
                <div className="flex justify-between items-center pt-4 border-t">
                  <span className="text-xs text-slate-400">Pastikan baris pertama berisi tajuk (header) kolom.</span>
                  <div className="flex gap-2">
                    <button onClick={() => setShowImportModal(false)} className="px-4 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100 rounded-lg">Batal</button>
                    <button onClick={handleImportTSV} className="px-4 py-2 text-sm font-semibold text-white bg-[#2b3990] rounded-lg shadow">Proses & Impor</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ALERT SYSTEM MODAL */}
          {alertConfig && (
            <div className="fixed inset-0 bg-slate-900/55 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-4 text-center border">
                <div className="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mx-auto text-xl">{alertConfig.type === 'confirm' ? '❓' : '💡'}</div>
                <div>
                  <h3 className="text-md font-extrabold text-slate-900">{alertConfig.title}</h3>
                  <p className="text-xs text-slate-500 mt-2 leading-relaxed">{alertConfig.message}</p>
                </div>
                <div className="flex justify-center gap-2 pt-2">
                  {alertConfig.type === 'confirm' && (<button onClick={() => setAlertConfig(null)} className="px-4 py-2 bg-slate-100 text-slate-600 font-bold text-xs uppercase rounded-xl">Batal</button>)}
                  <button onClick={() => { if (alertConfig.type === 'confirm' && alertConfig.onConfirm) alertConfig.onConfirm(); setAlertConfig(null); }} className="px-5 py-2.5 bg-[#2b3990] text-white font-bold text-xs uppercase rounded-xl shadow-sm">Ya</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-4 text-center text-xs print:hidden border-t border-slate-800">
            <p>© 2026 MALIKA ISLAMIC BOARDING SCHOOL • Tangerang, Banten</p>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
